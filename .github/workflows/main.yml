name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: "read"

jobs:
  composer:
    name: composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer validate --strict

  php:
    name: PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
        dependencies: ['default']
        include:
          - php-version: '8.1'
            dependencies: 'lowest'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Install dependencies (default)
        if: matrix.dependencies == 'default'
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Install dependencies (lowest)
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies
        if: matrix.php-version == '8.1'
        run: composer audit

      - name: Lint PHP files
        run: find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check coding style
        run: php vendor/bin/phpcs

      - name: Run tests
        run: php vendor/bin/phpunit

      - name: Run static analysis
        run: php vendor/bin/phpstan analyse --no-progress

