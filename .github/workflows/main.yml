name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: "read"

jobs:
  composer:
    name: composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make validate

  php:
    name: PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
        dependencies: ['default']
        include:
          - php-version: '8.1'
            dependencies: 'lowest'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Install dependencies (default)
        if: matrix.dependencies == 'default'
        run: make install PHP_VERSION=${{ matrix.php-version }}

      - name: Install dependencies (lowest)
        if: matrix.dependencies == 'lowest'
        run: make install PHP_VERSION=${{ matrix.php-version }} DEPENDENCIES_LOWEST=1

      - name: Audit dependencies
        if: matrix.php-version == '8.1' && matrix.dependencies == 'default'
        run: make audit

      - name: Lint PHP files
        run: make lint PHP_VERSION=${{ matrix.php-version }}

      - name: Check coding style
        run: make sniff PHP_VERSION=${{ matrix.php-version }}

      - name: Run tests
        run: make test PHP_VERSION=${{ matrix.php-version }}

      - name: Run static analysis
        run: make analyze PHP_VERSION=${{ matrix.php-version }}
